name: All City Network
description: ALLCITY Network (All City Network) is a sports media and podcasting company built on
  the tagline "Sports Over Everything." It operates a set of city-based sports networks — DNVR
  (Denver), PHNX (Phoenix), CHGO (Chicago), PHLY (Philadelphia), and DLLS (Dallas) — that produce
  team-focused podcasts, video shows, and written coverage of local professional and collegiate
  sports, alongside network-wide shows and NBA/NFL programming. The company reaches fans through
  audio and video podcasts, memberships, and a merchandise store. It is a Bullpen Capital portfolio
  company and is not an API provider; it publishes no developer portal, documentation, or API, so
  the API-specific artifacts of the enrichment pipeline are not applicable.
